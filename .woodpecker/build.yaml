variables:
  - &file Containerfile
  - &repo fuwafuwalabs/k6u

steps:
  - name: dry run
    when:
      - event:
          - pull_request
      - event:
          - manual
        evaluate: 'CI_COMMIT_BRANCH != CI_REPO_DEFAULT_BRANCH'
    image: woodpeckerci/plugin-kaniko:2.3.5@sha256:a481d1dbf661af90b6781735438a35c7b03a9d20510a8b4e5aa16166ea609e0b
    settings:
      dockerfile: *file
      dry_run: true

  - name: publish container
    when:
      - event:
          - push
          - tag
          - cron
          - manual
        branch:
          - ${CI_REPO_DEFAULT_BRANCH}
    image: woodpeckerci/plugin-kaniko:2.3.5@sha256:a481d1dbf661af90b6781735438a35c7b03a9d20510a8b4e5aa16166ea609e0b
    settings:
      dockerfile: *file
      repo: *repo
      auto_tag: true
      registry:
        from_secret: REGISTRY
      username:
        from_secret: REGISTRY_USER
      password:
        from_secret: REGISTRY_PASS
